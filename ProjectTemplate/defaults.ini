; This is an .INI file, used as a simple way to tune a game without recompiling/hardcoding it.
; A great place for gameplay variables and more. Another example of data-driven programming. 
[Level1]
levelFile=../Levels/GameLevel.json
modelPath=../Models
waveFile=../Levels/LevelData/Level1.json
[Player]
model=B2
hitpoints=1
speed=20.0
firerate=0.25
invulnPeriod=3
lives=3
respawnDelay=1.0
[Shaders]
pixel=../Shaders/LevelPixel.hlsl
vertex=../Shaders/LevelVertex.hlsl
starPixel=../Shaders/StarPixel.hlsl
starVertex=../Shaders/StarVertex.hlsl
[Window]
height=768
width=1024
xstart=100
ystart=100
leftBound = -0.9
rightBound = 0.9
topBound = 0.9
bottomBound = -0.9
[Enemy1]
model=Cactus
hitpoints=4
speed=8.0
score=200
firerate=0.5
scale=1
[Bullet]
model=Bullet
speed=20.0
[Sounds]
gpmusic =../Dev5 Sounds/Music/The Fifth Quadrant.wav
psmusic =../Dev5 Sounds/Music/pausedBG.wav
phit =../Dev5 Sounds/HitSound/WAB.wav
pshoot =../Dev5 Sounds/ShootSound/attack.wav
pdeath =../Dev5 Sounds/DeathSound/explode.wav
menu =../Dev5 Sounds/Pause/Digital C.wav
ehit =../Dev5 Sounds/HitSound/DDH.wav
edeath =../Dev5 Sounds/DeathSound/Popup.wav
[Global]
scrollSpeed = 0.75
[DropRate]
Carrier = 100
SideFighter = 0
MultiShot = 0
ScreenWipe = 100
ExtraLife = 0
BonusPoints = 0
; If you change this file it will replace the saved.ini version if its newer. 
