; This is an .INI file, used as a simple way to tune a game without recompiling/hardcoding it.
; A great place for gameplay variables and more. Another example of data-driven programming. 
[Level1]
levelFile=../Levels/GameLevel.json
modelPath=../Models
[Player]
model=B2
hitpoints=1
speed=8.0
firerate=0.25
invulnPeriod=3
lives=3
respawnDelay=1.0
[Shaders]
pixel=../Shaders/LevelPixel.hlsl
vertex=../Shaders/LevelVertex.hlsl
starPixel=../Shaders/StarPixel.hlsl
starVertex=../Shaders/StarVertex.hlsl
[Window]
height=768
width=1024
xstart=100
ystart=100
[Enemy1]
model=Cactus
initialShatterCount=4
hitpoints=4
speed=8.0
score=200
firerate=0.5
shatterAmount=2
shatterScale=0.7
[Bullet]
model=Bullet
speed=20.0
[Sounds]
gpmusic = ../Dev5 Sounds/Music/The Fifth Quadrant.wav
psmusic = ../Dev5 Sounds/Music/pausedBG.wav
phit = ../Dev5 Sounds/HitSound/Punch - Whack A Bot.wav
pshoot = ../Dev5 Sounds/ShootSound/attack.wav
pdeath = ../Dev5 Sounds/DeathSound/explode.wav
menu = ../Dev5 Sounds/Pause/Short - Digital Crystal.wav
ehit = ../Dev5 Sounds/HitSound/Dumpster Door Hit.wav
eshoot1 = ../Dev5 Sounds/ShootSound/Retro - Shuriken Laser
eshoot2 = ../Dev5 Sounds/ShootSound/Short - Digital Malfunction
edeath = ../Dev5 Sounds/DeathSound/Short - Mini Popup.wav
[Global]
scrollSpeed = 0.75
; If you change this file it will replace the saved.ini version if its newer. 
